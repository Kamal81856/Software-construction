<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - QuizApp</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin: 3rem 0;
      height: 250px;
    }
    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 120px;
    }
    .podium-name {
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .podium-pts {
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 5px;
    }
    .podium-block {
      width: 100%;
      border-radius: 8px 8px 0 0;
      display: flex;
      justify-content: center;
      padding-top: 10px;
      font-size: 2rem;
      font-weight: 800;
      color: white;
    }
    .rank-1 .podium-block { height: 180px; background-color: var(--color-yellow); }
    .rank-2 .podium-block { height: 130px; background-color: #c0c0c0; }
    .rank-3 .podium-block { height: 90px; background-color: #cd7f32; }
    
    .current-user-row {
      background-color: #e3f2fd !important;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mt-2 mb-2">Global Leaderboard</h1>
    
    <div id="podiumContainer" class="podium">
      <!-- Top 3 -->
    </div>

    <div class="card p-0">
      <table class="table">
        <thead>
          <tr>
            <th width="10%">Rank</th>
            <th width="50%">Player</th>
            <th width="20%">Quizzes</th>
            <th width="20%">Points</th>
          </tr>
        </thead>
        <tbody id="leaderboardTable">
          <!-- Remaining players -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
