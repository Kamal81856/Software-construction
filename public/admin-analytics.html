<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Analytics - QuizApp Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-val {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-blue);
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;" class="mb-2 mt-2">
      <h1 id="quizTitle">Quiz Analytics</h1>
      <a href="/admin-dashboard.html" class="btn" style="background: #eee;">Back to Dashboard</a>
    </div>

    <div class="stats-grid" id="analyticsGrid">
      <div class="stat-box">
        <div class="stat-val" id="totalAttempts">0</div>
        <div>Total Attempts</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="avgScore">0</div>
        <div>Average Score</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="highScore">0</div>
        <div>Highest Score</div>
      </div>
    </div>

    <h2 class="mb-1">Attempt History</h2>
    <div class="card p-0">
      <table class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>User</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attemptsTable">
          <!-- Loaded via JS -->
          <tr><td colspan="5" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!getUserData() || getUserData().role !== 'admin') {
        window.location.href = '/dashboard.html';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const quizId = urlParams.get('id');

      if (!quizId) {
        window.location.href = '/admin-dashboard.html';
        return;
      }

      try {
        // Get Analytics Overview
        const analytics = await fetchApi(`/results/analytics/${quizId}`);
        document.getElementById('totalAttempts').textContent = analytics.attempts;
        document.getElementById('avgScore').textContent = Math.round(analytics.averageScore * 10) / 10;
        document.getElementById('highScore').textContent = analytics.highestScore;

        // Get All Results for Table
        const results = await fetchApi(`/results/quiz/${quizId}`);
        const tbody = document.getElementById('attemptsTable');

        if (results.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">No attempts yet.</td></tr>';
          return;
        }

        tbody.innerHTML = results.map(r => `
          <tr>
            <td>${new Date(r.createdAt).toLocaleDateString()}</td>
            <td>${r.user ? r.user.name : 'Unknown User'}</td>
            <td>${r.score} / ${r.totalQuestions}</td>
            <td>${Math.round(r.percentage)}%</td>
            <td><span class="status-badge ${r.passed ? 'status-pass' : 'status-fail'}" style="margin:0; padding: 4px 8px; font-size: 0.8rem;">${r.passed ? 'PASS' : 'FAIL'}</span></td>
          </tr>
        `).join('');

      } catch (err) {
        showAlert('Error loading analytics: ' + err.message);
      }
    });
  </script>
</body>
</html>
