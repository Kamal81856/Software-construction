<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Editor - QuizApp Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .question-box {
      border: 2px solid #eee;
      padding: 1.5rem;
      border-radius: var(--border-radius);
      margin-bottom: 1.5rem;
      position: relative;
    }
    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--color-red);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: bold;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 800px;">
    <div class="card mt-2 mb-2">
      <h2 id="pageTitle" class="mb-2">Create New Quiz</h2>
      
      <form id="quizForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="category" class="form-control" placeholder="e.g. Science, Math, General" required>
        </div>
        <div class="form-group">
          <label>Timer (Seconds)</label>
          <input type="number" id="timer" class="form-control" value="60" required>
        </div>

        <h3 class="mt-2 mb-1">Questions</h3>
        <div id="questionsContainer"></div>
        
        <button type="button" class="btn mb-2" onclick="addQuestion()" style="background: var(--bg-color); border: 2px dashed #ccc; width: 100%;">+ Add Question</button>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <a href="/admin-dashboard.html" class="btn" style="background: #eee;">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Quiz</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin-quiz.js"></script>
</body>
</html>
