<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - QuizApp</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .result-card {
      text-align: center;
      padding: 3rem;
    }
    .score-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: var(--primary-blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      margin: 0 auto 2rem;
      box-shadow: 0 0 0 10px rgba(19, 104, 206, 0.2);
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .status-pass { background: #e8f5e9; color: var(--color-green); }
    .status-fail { background: #ffebee; color: var(--color-red); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card result-card mt-2">
      <div class="status-badge" id="statusBadge">Loading...</div>
      <div class="score-circle" id="scoreCircle">--%</div>
      
      <h2 class="mb-1">Quiz Completed!</h2>
      <p id="scoreDetails" class="mb-2" style="font-size: 1.2rem; color: var(--text-light);"></p>
      <p style="font-weight: 700; color: var(--color-yellow); font-size: 1.5rem; margin-bottom: 2rem;">+<span id="pointsEarned">0</span> Points</p>
      
      <div>
        <a href="/dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        <a href="/leaderboard.html" class="btn" style="border: 2px solid var(--primary-blue); color: var(--primary-blue); margin-left: 10px;">View Leaderboard</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/results.js"></script>
</body>
</html>
